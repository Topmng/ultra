[project]
name = "synth-ultra"
version = "0.1.0"
description = "Ultra-low-latency BTC 10s percentile forecast for Synth Ultra"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
synth-ultra-validate = "synth_ultra.validate:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
